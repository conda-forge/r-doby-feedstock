{% set version = "4.7.1" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-doby
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/doBy_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/doBy/doBy_{{ version }}.tar.gz
  sha256: a6d9b14e3b4f907addbe7461a39bab2c0efda6b78ee6b91372908cfaf87b827b

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-deriv
    - r-mass
    - r-matrix
    - r-boot
    - r-broom
    - r-cowplot
    - r-dplyr
    - r-forecast
    - r-ggplot2
    - r-microbenchmark
    - r-modelr
    - r-purrr
    - r-rlang
    - r-tibble
    - r-tidyr
  run:
    - r-base
    - r-deriv
    - r-mass
    - r-matrix
    - r-boot
    - r-broom
    - r-cowplot
    - r-dplyr
    - r-forecast
    - r-ggplot2
    - r-microbenchmark
    - r-modelr
    - r-purrr
    - r-rlang
    - r-tibble
    - r-tidyr

test:
  commands:
    - $R -e "library('doBy')"           # [not win]
    - "\"%R%\" -e \"library('doBy')\""  # [win]

about:
  home: https://github.com/hojsgaard/doBy
  dev_url: https://github.com/hojsgaard/doBy
  license: GPL-2.0-or-later
  summary: 'Utility package containing: Main categories: Working with grouped data: ''do'' something
    to data when  stratified ''by'' some variables.  General linear estimates. Data
    handling utilities. Functional programming, in particular restrict functions to
    a smaller domain. Miscellaneous functions for data handling. Model stability in
    connection with model selection. Miscellaneous other tools.'
  license_family: GPL2
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-2
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
